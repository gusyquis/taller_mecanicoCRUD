{% extends "base.html" %}
{% block content %}
    <a href="{{ url_for('nueva_orden') }}" class="btn btn-success mb-2">Nueva orden de trabajo</a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for item in ordenes %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.fecha }}</td>
                <td>{{ item.cliente }}</td>
                <td>{{ item.servicio }}</td>
                <td>
                    <a href="{{ url_for('eliminar_orden', id=item.id) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Está seguro de eliminar?');">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
