{% extends "base.html" %}
{% block content %}
    <div class="card">
        <div class="card-header">
            <h2>{% if servicio %}Editar{% else %}Nuevo{% endif %} servicio</h2>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text" class="form-control" name="descripcion"
                           value="{{ servicio.descripcion if servicio else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Costo (Bs)</label>
                    <input type="number" step="0.01" class="form-control" name="costo"
                           value="{{ servicio.costo if servicio else '' }}" required>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>
{% endblock %}
