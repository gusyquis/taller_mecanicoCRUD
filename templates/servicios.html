{% extends "base.html" %}
{% block content %}
    <a href="{{ url_for('nuevo_servicio') }}" class="btn btn-success mb-2">Nuevo servicio</a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Costo (Bs)</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for item in servicios %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.descripcion }}</td>
                <td>{{ item.costo }}</td>
                <td>
                    <a href="{{ url_for('editar_servicio', id=item.id) }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{{ url_for('eliminar_servicio', id=item.id) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Está seguro de eliminar?');">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
