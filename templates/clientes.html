{% extends "base.html" %}
{% block content %}
    <a href="{{ url_for('nuevo_cliente') }}" class="btn btn-success mb-2">Nuevo cliente</a>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for item in clientes %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.nombre }}</td>
                <td>{{ item.apellidos }}</td>
                <td>{{ item.telefono }}</td>
                <td>
                    <a href="{{ url_for('editar_cliente', id=item.id) }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{{ url_for('eliminar_cliente', id=item.id) }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Está seguro de eliminar?');">Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
